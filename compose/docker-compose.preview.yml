# ==============================================================================
# ALGO — Staging Environment
# ==============================================================================
# Mirrors production: no dev defaults, DEBUG=false, Nginx included.
# Services talk on algo-internal (not exposed); only Nginx is public.
#
# SETUP:
#   cp .env.example .env.staging
#   # fill in .env.staging — every REQUIRED field must be set
#   make staging-up
#
# ENDPOINTS (via Nginx on port 80):
#   Frontend:    http://<host>/
#   Auth API:    http://<host>/api/v1/auth/
#   Diag API:    http://<host>/api/v1/diagnostic/
#   Exam API:    http://<host>/api/v1/exam/
#   (Content API is intentionally NOT exposed through Nginx — it returns
#   answer keys and is reachable only on the internal Docker network, with
#   its own internal-service-token auth on top. See nginx/conf.d/preview.conf.)
# ==============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: algo-preview

services:

  # ── Databases ──────────────────────────────────────────────────────────────

  auth-db:
    image: postgres:15-alpine
    container_name: algo-preview-auth-db
    logging: *default-logging
    environment:
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: algo_auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    # Loopback-only — reachable solely via an SSH tunnel from the host itself,
    # never from the public internet. See docs/DB_ACCESS.md.
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - algo-internal

  diagnostic-db:
    image: postgres:15-alpine
    container_name: algo-preview-diagnostic-db
    logging: *default-logging
    environment:
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: algo_diagnostic
    volumes:
      - diagnostic-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_diagnostic"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - algo-internal

  exam-db:
    image: postgres:15-alpine
    container_name: algo-preview-exam-db
    logging: *default-logging
    environment:
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: algo_exam
    volumes:
      - exam-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_exam"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - algo-internal

  content-db:
    image: postgres:15-alpine
    container_name: algo-preview-content-db
    logging: *default-logging
    environment:
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: algo_content
    volumes:
      - content-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_content"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - algo-internal

  # ── Redis instances ────────────────────────────────────────────────────────

  auth-redis:
    image: redis:7-alpine
    container_name: algo-preview-auth-redis
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - auth-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - algo-internal

  diagnostic-redis:
    image: redis:7-alpine
    container_name: algo-preview-diagnostic-redis
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - diagnostic-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - algo-internal

  exam-redis:
    image: redis:7-alpine
    container_name: algo-preview-exam-redis
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - exam-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - algo-internal

  content-redis:
    image: redis:7-alpine
    container_name: algo-preview-content-redis
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - content-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - algo-internal

  # ── Microservices ──────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ../../preview-src/auth-services
      dockerfile: Dockerfile
      target: production
    container_name: algo-preview-auth
    logging: *default-logging
    environment:
      - DATABASE_URL=postgresql+psycopg2://algo:${POSTGRES_PASSWORD:?required}@auth-db:5432/algo_auth
      - REDIS_URL=redis://auth-redis:6379/0
      - APP_ENV=staging
      - DEBUG=false
      - RELEASE_SHA=${RELEASE_SHA:-unknown}
      - RELEASE_REF=${RELEASE_REF:-unknown}
      - RELEASED_AT=${RELEASED_AT:-unknown}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MATHPIX_APP_ID=${MATHPIX_APP_ID:-}
      - MATHPIX_APP_KEY=${MATHPIX_APP_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - EXAM_SERVICE_URL=http://algo-preview-exam:8003/api/v1
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost","http://localhost:3000"]}
    depends_on:
      auth-db:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    mem_limit: 384m
    networks:
      - algo-internal
      - algo-edge

  diagnostic-service:
    build:
      context: ../../preview-src/diagnostics-service
      dockerfile: Dockerfile
    container_name: algo-preview-diagnostic
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+psycopg2://algo:${POSTGRES_PASSWORD:?required}@diagnostic-db:5432/algo_diagnostic
      REDIS_URL: redis://diagnostic-redis:6379
      APP_ENV: staging
      DEBUG: "false"
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
      RELEASE_REF: ${RELEASE_REF:-unknown}
      RELEASED_AT: ${RELEASED_AT:-unknown}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Primary model for report generation; Gemini is the fallback. The
      # service's Settings reads a `.env` file that never exists in the image,
      # so these must be forwarded here or the key is silently unset and every
      # request quietly degrades to Gemini.
      AZURE_DEEPSEEK_API_KEY: ${AZURE_DEEPSEEK_API_KEY:-}
      AZURE_DEEPSEEK_ENDPOINT: ${AZURE_DEEPSEEK_ENDPOINT:-}
      AZURE_DEEPSEEK_MODEL: ${AZURE_DEEPSEEK_MODEL:-deepseek-v4-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      AUTH_SERVICE_URL: http://algo-preview-auth:8000
      CONTENT_SERVICE_URL: http://algo-preview-content:8004
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      WARMUP_ITEMS: ${WARMUP_ITEMS:-5}
      MIN_ITEMS: ${MIN_ITEMS:-12}
      MAX_ITEMS: ${MAX_ITEMS:-42}
      SE_THRESHOLD: ${SE_THRESHOLD:-0.30}
      CLASSIFICATION_MIN_ITEMS: ${CLASSIFICATION_MIN_ITEMS:-20}
      CLASSIFICATION_SE_THRESHOLD: ${CLASSIFICATION_SE_THRESHOLD:-0.40}
      CLASSIFICATION_CONFIDENCE_THRESHOLD: ${CLASSIFICATION_CONFIDENCE_THRESHOLD:-0.90}
      MIN_SECTION_COVERAGE: ${MIN_SECTION_COVERAGE:-5}
    depends_on:
      diagnostic-db:
        condition: service_healthy
      diagnostic-redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - algo-internal
      - algo-edge

  exam-service:
    build:
      context: ../../preview-src/exam-service
      dockerfile: Dockerfile
    container_name: algo-preview-exam
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+psycopg2://algo:${POSTGRES_PASSWORD:?required}@exam-db:5432/algo_exam
      REDIS_URL: redis://exam-redis:6379
      APP_ENV: staging
      DEBUG: "false"
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
      RELEASE_REF: ${RELEASE_REF:-unknown}
      RELEASED_AT: ${RELEASED_AT:-unknown}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Primary model for exam report generation; Gemini is the fallback.
      AZURE_DEEPSEEK_API_KEY: ${AZURE_DEEPSEEK_API_KEY:-}
      AZURE_DEEPSEEK_ENDPOINT: ${AZURE_DEEPSEEK_ENDPOINT:-}
      AZURE_DEEPSEEK_MODEL: ${AZURE_DEEPSEEK_MODEL:-deepseek-v4-flash}
      CONTENT_SERVICE_URL: http://algo-preview-content:8004
      AUTH_SERVICE_URL: http://algo-preview-auth:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      MAX_TASKS_PER_EXAM: ${MAX_TASKS_PER_EXAM:-50}
      MAX_VARIANTS: ${MAX_VARIANTS:-30}
      DEFAULT_TIME_MINUTES: ${DEFAULT_TIME_MINUTES:-45}
    depends_on:
      exam-db:
        condition: service_healthy
      exam-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - algo-internal
      - algo-edge

  content-service:
    build:
      context: ../../preview-src/content-service
      dockerfile: Dockerfile
    container_name: algo-preview-content
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+psycopg2://algo:${POSTGRES_PASSWORD:?required}@content-db:5432/algo_content
      REDIS_URL: redis://content-redis:6379
      APP_ENV: staging
      DEBUG: "false"
      # Figure binaries live outside the image and the SQL dump.
      FIGURES_DIR: /data/figures
      FIGURES_URL_PREFIX: /api/v1/figures
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
      RELEASE_REF: ${RELEASE_REF:-unknown}
      RELEASED_AT: ${RELEASED_AT:-unknown}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # The digitisation pipeline raises outright when these are blank, unlike
      # exam/diagnostics which fall back to Gemini.
      AZURE_DEEPSEEK_API_KEY: ${AZURE_DEEPSEEK_API_KEY:-}
      AZURE_DEEPSEEK_ENDPOINT: ${AZURE_DEEPSEEK_ENDPOINT:-}
      AZURE_DEEPSEEK_MODEL: ${AZURE_DEEPSEEK_MODEL:-deepseek-v4-flash}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-global}
      GOOGLE_CREDENTIALS_PATH: ${GOOGLE_CREDENTIALS_PATH:-}
      MATHPIX_APP_ID: ${MATHPIX_APP_ID:-}
      MATHPIX_APP_KEY: ${MATHPIX_APP_KEY:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    volumes:
      - content-figures:/data/figures
    depends_on:
      content-db:
        condition: service_healthy
      content-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - algo-internal
      - algo-edge

  # ── Frontend ───────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ../../preview-src/algo-front
      dockerfile: Dockerfile
      args:
        # These are baked into the Next.js bundle at build time.
        # For staging, point to the same host the user accesses (via Nginx path).
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:?NEXT_PUBLIC_AUTH_API_URL is required}
        NEXT_PUBLIC_EXAM_API_URL: ${NEXT_PUBLIC_EXAM_API_URL:?NEXT_PUBLIC_EXAM_API_URL is required}
        NEXT_PUBLIC_DIAG_API_URL: ${NEXT_PUBLIC_DIAG_API_URL:?NEXT_PUBLIC_DIAG_API_URL is required}
    container_name: algo-preview-frontend
    logging: *default-logging
    environment:
      - NODE_ENV=production
      # Both stacks share algo-edge: pin the preview container explicitly so
      # the server-side figure proxy cannot resolve the production alias.
      - CONTENT_API_URL=http://algo-preview-content:8004
      - RELEASE_SHA=${RELEASE_SHA:-unknown}
      - RELEASE_REF=${RELEASE_REF:-unknown}
      - RELEASED_AT=${RELEASED_AT:-unknown}
    depends_on:
      auth-service:
        condition: service_healthy
      diagnostic-service:
        condition: service_healthy
      exam-service:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - algo-internal
      - algo-edge

  # ── Landing Page ───────────────────────────────────────────────────────────

  landing:
    build:
      context: ../../preview-src/algo-landing
      dockerfile: Dockerfile
    container_name: algo-preview-landing
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    restart: unless-stopped
    networks:
      - algo-internal
      - algo-edge


# ==============================================================================
volumes:
  auth-db-data:
  diagnostic-db-data:
  exam-db-data:
  content-db-data:
  auth-redis-data:
  diagnostic-redis-data:
  exam-redis-data:
  content-redis-data:
  content-figures:

networks:
  algo-edge:
    external: true
  algo-internal:
    driver: bridge
    name: algo-preview-network
