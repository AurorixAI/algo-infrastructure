# ==============================================================================
# HTTP → HTTPS redirect + ACME challenge
# ==============================================================================

server {
    listen 80;
    server_name algolab.me www.algolab.me api.algolab.me;

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# HTTPS — Main site (algolab.me + www)
# Serves Next.js frontend via reverse proxy
# ==============================================================================

server {
    listen 443 ssl;
    http2 on;
    server_name algolab.me www.algolab.me;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/algolab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algolab.me/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/algolab.me/chain.pem;

    # TLS hardening (A+ on SSLLabs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.algolab.me;" always;

    # Next.js frontend
    # When deployed: replace with your frontend container or static files
    location / {
        proxy_pass http://algo-front:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ==============================================================================
# HTTPS — API subdomain (api.algolab.me)
# Routes to each microservice by path prefix
# ==============================================================================

server {
    listen 443 ssl;
    http2 on;
    server_name api.algolab.me;

    # SSL (same cert — must add api.algolab.me to certbot SAN)
    ssl_certificate     /etc/letsencrypt/live/algolab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algolab.me/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/algolab.me/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Propagate real client IP
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── Auth Service ──────────────────────────────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://auth_backend/api/v1/auth/;
        proxy_read_timeout 30s;
    }

    location /api/v1/organizations/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://auth_backend/api/v1/organizations/;
        proxy_read_timeout 30s;
    }

    location /api/v1/students/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://auth_backend/api/v1/students/;
        proxy_read_timeout 30s;
    }

    location /api/v1/groups/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://auth_backend/api/v1/groups/;
        proxy_read_timeout 30s;
    }

    # ── Diagnostic Service ────────────────────────────────────────────────────
    location /api/v1/diagnostic/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://diagnostic_backend/api/v1/diagnostic/;
        proxy_read_timeout 120s;
    }

    # ── Exam Service ──────────────────────────────────────────────────────────
    location /api/v1/exam/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://exam_backend/api/v1/exam/;
        proxy_read_timeout 120s;
    }

    location /api/v1/exams/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://exam_backend/api/v1/exams/;
        proxy_read_timeout 120s;
    }

    # ── Content Service ───────────────────────────────────────────────────────
    location /api/v1/content/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://content_backend/api/v1/content/;
        proxy_read_timeout 60s;
    }

    # ── Health checks (public, no rate limit) ─────────────────────────────────
    location ~ ^/health/(auth|diag|exam|content)$ {
        # Internal health aggregation — return 200 if all services live
        # For simplicity, expose individual service health via named locations
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
