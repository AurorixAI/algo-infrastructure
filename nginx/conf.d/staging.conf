# Nginx — Staging (HTTP only, no TLS)
# Routes browser traffic to the correct container on the algo-internal network.

upstream frontend      { server frontend:3000; }
upstream auth          { server auth-service:8000; }
upstream diagnostic    { server diagnostic-service:8002; }
upstream exam          { server exam-service:8003; }
upstream content       { server content-service:8004; }
upstream landing       { server landing:5000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # ── API routes ─────────────────────────────────────────────────────────

    location /api/v1/auth/ {
        proxy_pass         http://auth/api/v1/auth/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        limit_req          zone=auth burst=20 nodelay;
    }

    location /api/v1/organizations/ {
        proxy_pass         http://auth/api/v1/organizations/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /api/v1/students/ {
        proxy_pass         http://auth/api/v1/students/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /api/v1/groups/ {
        proxy_pass         http://auth/api/v1/groups/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /api/v1/diagnostic/ {
        proxy_pass         http://diagnostic/api/v1/diagnostic/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/v1/exam {
        proxy_pass         http://exam/api/v1/exam;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/v1/content/ {
        proxy_pass         http://content/api/v1/content/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # ── Landing page (root) ────────────────────────────────────────────────
    location /landing/ {
        proxy_pass         http://landing/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Frontend (everything else) ─────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
