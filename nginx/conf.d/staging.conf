# Nginx — Staging (HTTPS via Let's Encrypt)
# Routes browser traffic to the correct container on the algo-internal network.
#
# ⚠ Upstreams MUST use container names (algo-staging-*), not bare compose
# service names (frontend, auth-service, ...). This nginx also sits on the
# shared `algo-edge` network to serve stage.algolab.me, and the preview stack
# publishes the very same service names as aliases there. With bare names,
# Docker resolved them to the *preview* containers and production silently
# started serving the stage stack and its empty databases. Container names are
# unique across both stacks, so they resolve unambiguously. Do not "simplify"
# these back to service names.

upstream frontend      { server algo-staging-frontend:3000; }
upstream auth          { server algo-staging-auth:8000; }
upstream diagnostic    { server algo-staging-diagnostic:8002; }
upstream exam          { server algo-staging-exam:8003; }
upstream content       { server algo-staging-content:8004; }
upstream landing       { server algo-staging-landing:5000; }

# One-time password links and capability codes must not enter access logs (K1, R3 M2).
map $uri $prod_safe_uri {
    default $uri;
    ~^/(?<prod_link_kind>d|e|invite|diagnostic|set-password)/[^/]+(?<prod_link_tail>/.*)?$ "/$prod_link_kind/[redacted]$prod_link_tail";
    ~^/api/v1/auth/password-links/[^/]+(?<prod_pl_tail>/.*)?$ "/api/v1/auth/password-links/[redacted]$prod_pl_tail";
    ~^/api/v1/(?<prod_api_kind>auth|internal)/diagnostic/[^/]+(?<prod_api_tail>/.*)?$ "/api/v1/$prod_api_kind/diagnostic/[redacted]$prod_api_tail";
    # K3 round 2: invitation code, exam code and the session id in the exam capability routes (also feeds the alias log).
    ~^/api/v1/auth/invite/[^/]+(?<prod_inv_tail>/.*)?$ "/api/v1/auth/invite/[redacted]$prod_inv_tail";
    ~^/api/v1/exams/by-code/[^/]+/session-status/[^/]+$ "/api/v1/exams/by-code/[redacted]/session-status/[redacted]";
    ~^/api/v1/exams/by-code/[^/]+(?<prod_bc_tail>/.*)?$ "/api/v1/exams/by-code/[redacted]$prod_bc_tail";
}
log_format prod_safe '$remote_addr - [$time_local] "$request_method $prod_safe_uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

# ── HTTP: ACME challenge + redirect everything else to HTTPS ────────────────
server {
    listen 80 default_server;
    server_name algolab.me www.algolab.me _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────
# `default_server` is explicit on purpose: production must answer a request
# whose Host matches nothing. Without it nginx silently promotes whichever
# server block it loaded first, which is decided by the alphabetical order of
# the files in conf.d — so renaming a file would hand unmatched production
# traffic to the preview stack.
server {
    listen 443 ssl default_server;
    access_log /var/log/nginx/access.log prod_safe;
    http2 on;
    server_name algolab.me www.algolab.me;

    ssl_certificate     /etc/letsencrypt/live/algolab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algolab.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    # ── API routes ─────────────────────────────────────────────────────────

    # The console API is served only on console.algolab.me (K1).
    location /api/v1/platform/ {
        return 404;
    }

    # Public «Запросить демо» form (K1).
    location /api/v1/public/ {
        client_max_body_size 64k;          # K3: the demo form is a small JSON; the server block allows 50m for imports
        proxy_pass         http://auth/api/v1/public/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req          zone=auth burst=20 nodelay;
    }

    location /api/v1/auth/ {
        proxy_pass         http://auth/api/v1/auth/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req          zone=auth burst=20 nodelay;
    }

    location /api/v1/organizations/ {
        proxy_pass         http://auth/api/v1/organizations/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Exam history is owned by exam-service; the remaining student routes
    # continue to use auth. Regex wins over the general student prefix.
    location ~ ^/api/v1/students/[^/]+/exam-history$ {
        proxy_pass         http://exam;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/students/ {
        proxy_pass         http://auth/api/v1/students/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/groups/ {
        proxy_pass         http://auth/api/v1/groups/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/diagnostic/ {
        proxy_pass         http://diagnostic/api/v1/diagnostic/;
        # DIAG-6: answers are capped at 2000 chars; no diagnostic request needs more than a few KB
        client_max_body_size 256k;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Analytics lives in diagnostics-service too (separate router/prefix) —
    # without this block every analyticsApi.* call 404s by falling through
    # to the frontend catch-all instead of reaching the backend.
    location /api/v1/analytics/ {
        proxy_pass         http://diagnostic/api/v1/analytics/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/exam {
        proxy_pass         http://exam/api/v1/exam;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # exam-service also owns the textbook catalogue the exam builder reads
    # (list, skill tree, table of contents, tasks). Without these blocks the
    # requests fell through to the frontend catch-all and answered 404, so
    # "По учебнику" and "По темам" could never load. `/api/v1/internal` and
    # `/api/v1/toc` are deliberately NOT exposed: the first is
    # service-to-service only, the second is not called by any client.
    location /api/v1/textbooks {
        proxy_pass         http://exam/api/v1/textbooks;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Organisation-wide, read-only exam monitoring for admins.
    location /api/v1/admin/ {
        proxy_pass         http://exam/api/v1/admin/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Deliberately no public /api/v1/content/ route.  The content read API
    # includes correct answers and distractor metadata for exam/diagnostic
    # services, so it is reachable only through the internal Docker network.
    # Student-facing figures are served by the frontend's constrained proxy.

    # ── Landing page (root) ────────────────────────────────────────────────
    location /landing/ {
        proxy_pass         http://landing/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Frontend (everything else) ─────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ── app.algolab.me: the PRODUCT (K3 I3) ───────────────────────────────────────────────────────────────────────────
# A copy of the product block that serves algolab.me today, plus the headers stage already has (Referrer-Policy:
# no-referrer). Added BEFORE the apex switch (K3 §5, step 5), so that app.algolab.me can be checked while algolab.me
# is still the product. Not rolled back with the apex: sessions, certificate and e-mail links point at app.
#
# ⚠ Callbacks of payment systems and any other server-to-server webhook go ONLY to https://app.algolab.me/api/v1/…,
#   never to algolab.me (the landing; K3 I11). CORS: `https://algolab.me` must never be added to CORS_ORIGINS of
#   the services (K3 §0 п.5): the landing's scripts could then read the API of a signed-in user.
#
# Edit the API locations of this block together with the apex block (and, from step 7, with the transitional alias
# in staging-apex-landing.conf): the three must stay identical.
server {
    listen 443 ssl;
    http2 on;
    server_name app.algolab.me;
    access_log /var/log/nginx/access.log prod_safe;

    # A diagnostic capability in the page URL must not become the Referer of asset/API requests
    # (same headers as on stage.algolab.me, preview.conf).
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;
    # K3 round 2: baseline headers of the product host. HSTS without includeSubDomains/preload (host-only). SAMEORIGIN: nobody
    # embeds the product from another origin (checked: the only iframe in the front shows an own blob: PDF; the Telegram app is
    # tg.algolab.me and does not frame it). The upstream's own copies are hidden so the answer carries exactly one.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Stream responses beyond the bounded proxy buffers instead of spilling them to disk and logging the caller's
    # Referer in a temporary-file warning.
    proxy_max_temp_file_size 0;

    # The one certificate of all production names (algolab.me, www, console, console.stage, stage, tg, app, landing.stage):
    # `app.` is a SAN of /etc/letsencrypt/live/algolab.me (K3 I2).
    ssl_certificate     /etc/letsencrypt/live/algolab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algolab.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    # ── API routes ─────────────────────────────────────────────────────────

    # The console API is served only on console.algolab.me (K1).
    location /api/v1/platform/ {
        return 404;
    }

    # Public «Запросить демо» form (K1).
    location /api/v1/public/ {
        client_max_body_size 64k;          # K3: the demo form is a small JSON; the server block allows 50m for imports
        proxy_pass         http://auth/api/v1/public/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req          zone=auth burst=20 nodelay;
    }

    location /api/v1/auth/ {
        proxy_pass         http://auth/api/v1/auth/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req          zone=auth burst=20 nodelay;
    }

    location /api/v1/organizations/ {
        proxy_pass         http://auth/api/v1/organizations/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Exam history is owned by exam-service; the remaining student routes
    # continue to use auth. Regex wins over the general student prefix.
    location ~ ^/api/v1/students/[^/]+/exam-history$ {
        proxy_pass         http://exam;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/students/ {
        proxy_pass         http://auth/api/v1/students/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/groups/ {
        proxy_pass         http://auth/api/v1/groups/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/diagnostic/ {
        proxy_pass         http://diagnostic/api/v1/diagnostic/;
        # DIAG-6: answers are capped at 2000 chars; no diagnostic request needs more than a few KB
        client_max_body_size 256k;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Analytics lives in diagnostics-service too (separate router/prefix) —
    # without this block every analyticsApi.* call 404s by falling through
    # to the frontend catch-all instead of reaching the backend.
    location /api/v1/analytics/ {
        proxy_pass         http://diagnostic/api/v1/analytics/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/exam {
        proxy_pass         http://exam/api/v1/exam;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # exam-service also owns the textbook catalogue the exam builder reads
    # (list, skill tree, table of contents, tasks). Without these blocks the
    # requests fell through to the frontend catch-all and answered 404, so
    # "По учебнику" and "По темам" could never load. `/api/v1/internal` and
    # `/api/v1/toc` are deliberately NOT exposed: the first is
    # service-to-service only, the second is not called by any client.
    location /api/v1/textbooks {
        proxy_pass         http://exam/api/v1/textbooks;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Organisation-wide, read-only exam monitoring for admins.
    location /api/v1/admin/ {
        proxy_pass         http://exam/api/v1/admin/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Deliberately no public /api/v1/content/ route.  The content read API
    # includes correct answers and distractor metadata for exam/diagnostic
    # services, so it is reachable only through the internal Docker network.
    # Student-facing figures are served by the frontend's constrained proxy.

    # ── Frontend (everything else) ─────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

# ── console.algolab.me: «Панель ALGO» (K1) ─────────────────────────────────
# Static export of algo-front/console (no Node process); the only API is
# /api/v1/platform/ on auth. Host is passed through: auth refuses platform
# requests whose Host is not a console host.
server {
    listen 443 ssl;
    http2 on;
    server_name console.algolab.me;
    access_log /var/log/nginx/access.log prod_safe;

    ssl_certificate     /etc/letsencrypt/live/algolab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algolab.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/v1/platform/ {
        proxy_pass         http://auth/api/v1/platform/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req          zone=auth burst=20 nodelay;
    }

    location /api/ {
        return 404;
    }

    root /usr/share/nginx/console-prod;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

# ── tg.algolab.me: Telegram Mini App ученика — ДЕМО (owner 27.10) ────────────
# Static Vite build with mock data only (VITE_DEMO=1, no API calls); real data
# comes with R1. Telegram Web/Desktop opens mini apps in an iframe, so framing
# is allowed for telegram.org only (no X-Frame-Options DENY here).
server {
    listen 443 ssl;
    http2 on;
    server_name tg.algolab.me;
    access_log /var/log/nginx/access.log prod_safe;

    ssl_certificate     /etc/letsencrypt/live/algolab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algolab.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;

    location /api/ {
        return 404;
    }

    root /usr/share/nginx/tma;
    location /assets/ {
        expires max;
        try_files $uri =404;
    }
    # `expires` (not add_header) keeps the server-level security headers.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
