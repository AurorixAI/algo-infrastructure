# Nginx — stage.algolab.me (preview stack)
#
# Second environment on the same host, fronted by the same nginx as production.
# Upstreams resolve to the algo-preview-* containers over the shared
# `algo-edge` Docker network. TLS uses the same certificate as production,
# which was expanded to cover stage.algolab.me.
#
# http://stage.algolab.me is handled by the catch-all :80 server in
# staging.conf (ACME challenge + 301 to HTTPS), so no :80 block is needed here.

upstream preview_frontend   { server algo-preview-frontend:3000; }
upstream preview_auth       { server algo-preview-auth:8000; }
upstream preview_diagnostic { server algo-preview-diagnostic:8002; }
upstream preview_exam       { server algo-preview-exam:8003; }
upstream preview_content    { server algo-preview-content:8004; }
upstream preview_landing    { server algo-preview-landing:5000; }

# ── HTTPS ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name stage.algolab.me;

    ssl_certificate     /etc/letsencrypt/live/algolab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algolab.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    # ── API routes ─────────────────────────────────────────────────────────

    location /api/v1/auth/ {
        proxy_pass         http://preview_auth/api/v1/auth/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req          zone=preview_auth burst=20 nodelay;
    }

    location /api/v1/organizations/ {
        proxy_pass         http://preview_auth/api/v1/organizations/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/students/ {
        proxy_pass         http://preview_auth/api/v1/students/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/groups/ {
        proxy_pass         http://preview_auth/api/v1/groups/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/diagnostic/ {
        proxy_pass         http://preview_diagnostic/api/v1/diagnostic/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Analytics lives in diagnostics-service too (separate router/prefix) —
    # without this block every analyticsApi.* call 404s by falling through
    # to the frontend catch-all instead of reaching the backend.
    location /api/v1/analytics/ {
        proxy_pass         http://preview_diagnostic/api/v1/analytics/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/exam {
        proxy_pass         http://preview_exam/api/v1/exam;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/v1/content/ {
        proxy_pass         http://preview_content/api/v1/content/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Landing page (root) ────────────────────────────────────────────────
    location /landing/ {
        proxy_pass         http://preview_landing/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Frontend (everything else) ─────────────────────────────────────────
    location / {
        proxy_pass         http://preview_frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# Rate limiting zone for the preview stack (separate counter from prod)
limit_req_zone $binary_remote_addr zone=preview_auth:10m rate=10r/s;
