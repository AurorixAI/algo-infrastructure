name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Lint — ruff for all Python services
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - diagnostic-service
          - exam-service
          - content-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff
        working-directory: ${{ matrix.service }}
        run: ruff check src/ --select E,F,W --ignore E501

  # ─────────────────────────────────────────────────────────────────────────────
  # Tests — auth-service (full coverage), exam-service (unit only)
  # ─────────────────────────────────────────────────────────────────────────────
  test-auth:
    name: Tests — auth-service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: algo_user
          POSTGRES_PASSWORD: algo_password
          POSTGRES_DB: algo_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U algo_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: auth-service
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov

      - name: Run tests
        working-directory: auth-service
        env:
          DATABASE_URL: postgresql://algo_user:algo_password@localhost:5432/algo_auth_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-32-characters-long
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          ENVIRONMENT: test
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=60

  test-exam:
    name: Tests — exam-service (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: exam-service
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run unit tests
        working-directory: exam-service
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          REDIS_URL: redis://localhost:6379/0
          CONTENT_SERVICE_URL: http://localhost:8004
        run: pytest tests/test_unit.py -v --tb=short --ignore=tests/test_integration.py

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker Build — verify each service builds without error
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            image: algo-auth
          - service: diagnostic-service
            image: algo-diagnostic
          - service: exam-service
            image: algo-exam
          - service: content-service
            image: algo-content
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          push: false
          tags: ${{ matrix.image }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
