# ==============================================================================
# ALGO — Nginx Reverse Proxy + Let's Encrypt (Certbot)
# Domain: algolab.me
#
# SETUP STEPS (first time on VM):
#   1. Point DNS A records to your VM IP:
#        algolab.me        → <VM_IP>
#        www.algolab.me    → <VM_IP>
#        api.algolab.me    → <VM_IP>
#
#   2. Create required directories:
#        mkdir -p /etc/letsencrypt /var/www/certbot
#
#   3. Initial certificate (HTTP-01 challenge):
#        docker compose -f docker-compose.nginx.yml run --rm certbot certonly \
#          --webroot --webroot-path=/var/www/certbot \
#          -d algolab.me -d www.algolab.me -d api.algolab.me \
#          --email your@email.com --agree-tos --no-eff-email
#
#   4. Start Nginx:
#        docker compose -f docker-compose.nginx.yml up -d
#
#   5. Auto-renewal (cron, runs twice daily):
#        echo "0 3,15 * * * root docker compose -f /opt/algo/docker-compose.nginx.yml run --rm certbot renew --quiet && docker compose -f /opt/algo/docker-compose.nginx.yml exec nginx nginx -s reload" >> /etc/cron.d/certbot-renew
# ==============================================================================

version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: algo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    restart: unless-stopped
    networks:
      - algo-network
    depends_on: []
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    container_name: algo-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --quiet; done'
    restart: unless-stopped

networks:
  algo-network:
    external: true
    name: algo-network
