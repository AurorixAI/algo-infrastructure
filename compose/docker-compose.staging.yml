# ==============================================================================
# ALGO — Staging Environment
# ==============================================================================
# Mirrors production: no dev defaults, DEBUG=false, Nginx included.
# Services talk on algo-internal (not exposed); only Nginx is public.
#
# SETUP:
#   cp .env.example .env.staging
#   # fill in .env.staging — every REQUIRED field must be set
#   make staging-up
#
# ENDPOINTS (via Nginx on port 80):
#   Frontend:    http://<host>/
#   Auth API:    http://<host>/api/v1/auth/
#   Diag API:    http://<host>/api/v1/diagnostic/
#   Exam API:    http://<host>/api/v1/exam/
#   (Content API is intentionally NOT exposed through Nginx — it returns
#   answer keys and is reachable only on the internal Docker network, with
#   its own internal-service-token auth on top. See nginx/conf.d/staging.conf.)
# ==============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: algo-staging

services:

  # ── Databases ──────────────────────────────────────────────────────────────

  auth-db:
    image: postgres:15-alpine
    container_name: algo-staging-auth-db
    logging: *default-logging
    environment:
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: algo_auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    # Loopback-only — reachable solely via an SSH tunnel from the host itself,
    # never from the public internet. See docs/DB_ACCESS.md.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - algo-internal

  diagnostic-db:
    image: postgres:15-alpine
    container_name: algo-staging-diagnostic-db
    logging: *default-logging
    environment:
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: algo_diagnostic
    volumes:
      - diagnostic-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_diagnostic"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - algo-internal

  exam-db:
    image: postgres:15-alpine
    container_name: algo-staging-exam-db
    logging: *default-logging
    environment:
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: algo_exam
    volumes:
      - exam-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_exam"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - algo-internal

  content-db:
    image: postgres:15-alpine
    container_name: algo-staging-content-db
    logging: *default-logging
    environment:
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: algo_content
    volumes:
      - content-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_content"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - algo-internal

  # ── Redis instances ────────────────────────────────────────────────────────

  auth-redis:
    image: redis:7-alpine
    container_name: algo-staging-auth-redis
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - auth-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - algo-internal

  diagnostic-redis:
    image: redis:7-alpine
    container_name: algo-staging-diagnostic-redis
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - diagnostic-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - algo-internal

  exam-redis:
    image: redis:7-alpine
    container_name: algo-staging-exam-redis
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - exam-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - algo-internal

  content-redis:
    image: redis:7-alpine
    container_name: algo-staging-content-redis
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - content-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - algo-internal

  # ── Microservices ──────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ../../auth-services
      dockerfile: Dockerfile
      target: production
    container_name: algo-staging-auth
    logging: *default-logging
    environment:
      - CONSOLE_HOSTS=console.algolab.me
      - CONSOLE_URL=${CONSOLE_URL:?CONSOLE_URL is required}
      - ADMIN_NOTIFICATION_EMAIL=${ADMIN_NOTIFICATION_EMAIL:-}
      - SMTP_FROM_NAME=ALGO
      # K2-1 (G): Reply-To is the support alias (an alias of the Zoho mailbox), not a personal address; MAIL_ALLOWLIST empty = no restriction on prod
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-support@algolab.me}
      - MAIL_ALLOWLIST=${MAIL_ALLOWLIST:-}
      # K2-1 (D): «Запомнить меня» = 14 days sliding; a session without the tick lasts 12 h from the sign-in (fixed in code)
      - JWT_REFRESH_TTL_DAYS=${JWT_REFRESH_TTL_DAYS:-14}
      - SITE_URL=${SITE_URL:?SITE_URL is required}
      - SELF_REGISTRATION_CLOSED=true
      - AUTO_APPROVE_ORGANIZATIONS=false
      - SMTP_HOST=smtp-relay.brevo.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=noreply@algolab.me
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - DIAGNOSTIC_BASE_URL=${DIAGNOSTIC_BASE_URL:?DIAGNOSTIC_BASE_URL is required}
      - REQUIRE_DIAGNOSTIC_BASE_URL=true
      - REQUIRE_DISTINCT_SITE_HOSTS=${REQUIRE_DISTINCT_SITE_HOSTS:-false}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES:-}
      - DATABASE_URL=postgresql+psycopg2://algo:${POSTGRES_PASSWORD:?required}@auth-db:5432/algo_auth
      - REDIS_URL=redis://auth-redis:6379/0
      - APP_ENV=staging
      - DEBUG=false
      - RELEASE_SHA=${RELEASE_SHA:-unknown}
      - RELEASE_REF=${RELEASE_REF:-unknown}
      - RELEASED_AT=${RELEASED_AT:-unknown}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MATHPIX_APP_ID=${MATHPIX_APP_ID:-}
      - MATHPIX_APP_KEY=${MATHPIX_APP_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - EXAM_SERVICE_URL=http://exam-service:8003/api/v1
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost","http://localhost:3000"]}
    depends_on:
      auth-db:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - algo-internal

  diagnostic-service:
    build:
      context: ../../diagnostics-service
      dockerfile: Dockerfile
    container_name: algo-staging-diagnostic
    init: true  # DIAG-6: reaps the sympy worker if a uvicorn worker is killed
    logging: *default-logging
    environment:
      REPORT_NARRATIVE_ENABLED: ${REPORT_NARRATIVE_ENABLED:-true}
      DATABASE_URL: postgresql://algo:${POSTGRES_PASSWORD:?required}@diagnostic-db:5432/algo_diagnostic
      REDIS_URL: redis://diagnostic-redis:6379
      APP_ENV: staging
      DEBUG: "false"
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
      RELEASE_REF: ${RELEASE_REF:-unknown}
      RELEASED_AT: ${RELEASED_AT:-unknown}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Primary model for report generation; Gemini is the fallback. The
      # service's Settings reads a `.env` file that never exists in the image,
      # so these must be forwarded here or the key is silently unset and every
      # request quietly degrades to Gemini.
      AZURE_DEEPSEEK_API_KEY: ${AZURE_DEEPSEEK_API_KEY:-}
      AZURE_DEEPSEEK_ENDPOINT: ${AZURE_DEEPSEEK_ENDPOINT:-}
      AZURE_DEEPSEEK_MODEL: ${AZURE_DEEPSEEK_MODEL:-deepseek-v4-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      AUTH_SERVICE_URL: http://auth-service:8000
      CONTENT_SERVICE_URL: http://content-service:8004
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      WARMUP_ITEMS: ${WARMUP_ITEMS:-5}
      MIN_ITEMS: ${MIN_ITEMS:-12}
      MAX_ITEMS: ${MAX_ITEMS:-42}
      SE_THRESHOLD: ${SE_THRESHOLD:-0.30}
      MIN_SECTION_COVERAGE: ${MIN_SECTION_COVERAGE:-5}
      # Deep Scan variant A9 (DIAG-1, owner «да» 13.10): residual rule d2 >= 1.0 in every grade,
      # hard-prerequisite trigger from grade 6. Roll back by setting DEEP_SCAN_TRIGGER_RULE=current and
      # DEEP_SCAN_TRIGGER_MODE=importance in the server .env, then recreating the container.
      DEEP_SCAN_TRIGGER_RULE: ${DEEP_SCAN_TRIGGER_RULE:-d2}
      DEEP_SCAN_RESIDUAL_MIN: ${DEEP_SCAN_RESIDUAL_MIN:-1.0}
      DEEP_SCAN_TRIGGER_MODE: ${DEEP_SCAN_TRIGGER_MODE:-hard_prereq}
      DEEP_SCAN_HARD_PREREQ_MIN_GRADE: ${DEEP_SCAN_HARD_PREREQ_MIN_GRADE:-6}
    depends_on:
      diagnostic-db:
        condition: service_healthy
      diagnostic-redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - algo-internal

  exam-service:
    build:
      context: ../../exam-service
      dockerfile: Dockerfile
    container_name: algo-staging-exam
    logging: *default-logging
    environment:
      REPORT_NARRATIVE_ENABLED: ${REPORT_NARRATIVE_ENABLED:-true}
      DATABASE_URL: postgresql://algo:${POSTGRES_PASSWORD:?required}@exam-db:5432/algo_exam
      REDIS_URL: redis://exam-redis:6379
      APP_ENV: staging
      DEBUG: "false"
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
      RELEASE_REF: ${RELEASE_REF:-unknown}
      RELEASED_AT: ${RELEASED_AT:-unknown}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Primary model for exam report generation; Gemini is the fallback.
      AZURE_DEEPSEEK_API_KEY: ${AZURE_DEEPSEEK_API_KEY:-}
      AZURE_DEEPSEEK_ENDPOINT: ${AZURE_DEEPSEEK_ENDPOINT:-}
      AZURE_DEEPSEEK_MODEL: ${AZURE_DEEPSEEK_MODEL:-deepseek-v4-flash}
      CONTENT_SERVICE_URL: http://content-service:8004
      AUTH_SERVICE_URL: http://auth-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      MAX_TASKS_PER_EXAM: ${MAX_TASKS_PER_EXAM:-50}
      MAX_VARIANTS: ${MAX_VARIANTS:-30}
      DEFAULT_TIME_MINUTES: ${DEFAULT_TIME_MINUTES:-45}
    depends_on:
      exam-db:
        condition: service_healthy
      exam-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    mem_limit: 1536m
    networks:
      - algo-internal

  content-service:
    build:
      context: ../../content-service
      dockerfile: Dockerfile
    container_name: algo-staging-content
    logging: *default-logging
    environment:
      # Figure binaries live outside the image and the SQL dump (same as stage).
      FIGURES_DIR: /data/figures
      FIGURES_URL_PREFIX: /api/v1/figures
      DATABASE_URL: postgresql://algo:${POSTGRES_PASSWORD:?required}@content-db:5432/algo_content
      REDIS_URL: redis://content-redis:6379
      APP_ENV: staging
      DEBUG: "false"
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
      RELEASE_REF: ${RELEASE_REF:-unknown}
      RELEASED_AT: ${RELEASED_AT:-unknown}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # The digitisation pipeline raises outright when these are blank, unlike
      # exam/diagnostics which fall back to Gemini.
      AZURE_DEEPSEEK_API_KEY: ${AZURE_DEEPSEEK_API_KEY:-}
      AZURE_DEEPSEEK_ENDPOINT: ${AZURE_DEEPSEEK_ENDPOINT:-}
      AZURE_DEEPSEEK_MODEL: ${AZURE_DEEPSEEK_MODEL:-deepseek-v4-flash}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-global}
      GOOGLE_CREDENTIALS_PATH: ${GOOGLE_CREDENTIALS_PATH:-}
      MATHPIX_APP_ID: ${MATHPIX_APP_ID:-}
      MATHPIX_APP_KEY: ${MATHPIX_APP_KEY:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    depends_on:
      content-db:
        condition: service_healthy
      content-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    volumes:
      - content-figures:/data/figures
    networks:
      - algo-internal

  # ── Frontend ───────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ../../algo-front
      dockerfile: Dockerfile
      args:
        # Baked into the Next.js bundle at build time. K3 P1: EMPTY = the origin the page was opened from, so one
        # image serves any domain (prod / stage / app.). Keep these three empty in the server .env files.
        # For staging, point to the same host the user accesses (via Nginx path).
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-}
        NEXT_PUBLIC_EXAM_API_URL: ${NEXT_PUBLIC_EXAM_API_URL:-}
        NEXT_PUBLIC_DIAG_API_URL: ${NEXT_PUBLIC_DIAG_API_URL:-}
    container_name: algo-staging-frontend
    logging: *default-logging
    environment:
      - NODE_ENV=production
      # The figures proxy (src/app/api/v1/figures) reads task pictures from content-service
      # over the internal network; without it every task figure on algolab.me answered 502.
      - CONTENT_API_URL=http://algo-staging-content:8004
      - RELEASE_SHA=${RELEASE_SHA:-unknown}
      - RELEASE_REF=${RELEASE_REF:-unknown}
      - RELEASED_AT=${RELEASED_AT:-unknown}
      # K3 P2: public address of the landing (the «Нет доступа? Запросить демо» link and the old /request-demo, /register
      # links go there). RUNTIME variable, not NEXT_PUBLIC_*: one image on every domain. Named FRONTEND_SITE_URL in the
      # env file so it cannot be confused with SITE_URL of auth-service (the two may differ in future).
      - SITE_URL=${FRONTEND_SITE_URL:?FRONTEND_SITE_URL is required (public landing address, e.g. https://algolab.me)}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-}
    depends_on:
      auth-service:
        condition: service_healthy
      diagnostic-service:
        condition: service_healthy
      exam-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - algo-internal

  # ── Landing Page ───────────────────────────────────────────────────────────

  landing:
    build:
      context: ../../algo-landing
      dockerfile: Dockerfile
    container_name: algo-staging-landing
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    restart: unless-stopped
    networks:
      - algo-internal

  # ── Nginx reverse proxy ────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: algo-staging-nginx
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The whole directory, not the two files individually. A single-file
      # bind mount is pinned to the inode it was created from, and `git pull`
      # replaces a file rather than rewriting it — so config changes were
      # silently invisible to the running container, which kept serving the
      # copy it started with until someone recreated it. `nginx -t` and
      # `nginx -s reload` both "succeeded" against that stale copy. The unused
      # legacy algolab.conf that this mount used to avoid has been deleted.
      # Which server answers an unmatched Host is pinned by `default_server`
      # in staging.conf, not by the load order of these files.
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # «Панель ALGO» static exports (K1), written by the front deploy.
      - ../../console/prod:/usr/share/nginx/console-prod:ro
      - ../../console/stage:/usr/share/nginx/console-stage:ro
      # Telegram Mini App demo (tg.algolab.me), static build copied in place.
      - ../../tma/prod:/usr/share/nginx/tma:ro
      # Landing static builds (K3 L9/I7), written IN PLACE by algo-landing/deploy/deploy_landing.sh (rsync). Never rename
      # these folders: nginx would stay on the old deleted inode. `stage` is served by landing.stage.algolab.me (preview.conf);
      # `prod` is mounted ahead of step 7 and is used only by staging-apex-landing.conf (disabled until then).
      - ../../landing/stage:/usr/share/nginx/landing-stage:ro
      - ../../landing/prod:/usr/share/nginx/landing-prod:ro
      # Counter of the 30-day API alias on algolab.me (K3 I4): written by nginx, kept outside the container so a recreate
      # does not lose the evidence for «0 hits for a week». Used only after step 7 (staging-apex-landing.conf).
      - ../../nginx-alias-log:/var/log/nginx-alias
    depends_on:
      - frontend
      - auth-service
      - diagnostic-service
      - exam-service
      - content-service
    restart: unless-stopped
    networks:
      - algo-internal
      # Shared network with the preview stack. Only nginx crosses over —
      # the two stacks' app containers and databases stay isolated.
      - algo-edge

# ==============================================================================
volumes:
  auth-db-data:
  diagnostic-db-data:
  exam-db-data:
  content-db-data:
  auth-redis-data:
  diagnostic-redis-data:
  exam-redis-data:
  content-redis-data:
  content-figures:

networks:
  algo-internal:
    driver: bridge
    name: algo-staging-network
  # Created out-of-band (`docker network create algo-edge`) because it is
  # shared with the independent algo-preview compose project.
  algo-edge:
    external: true
