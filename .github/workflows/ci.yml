name: CI

# This repo holds infrastructure only — compose files, nginx configs and
# operational scripts. Application lint/tests belong to each service's own
# repo (see their deploy.yml), which is where the source actually lives.
#
# The previous version of this workflow ran ruff / pytest / docker-build with
# `working-directory: auth-service`, `content-service`, and so on. Those
# directories do not exist here — every service is a separate repo — so all
# ten jobs failed within seconds of checkout, and had done so since the
# workflow was first written. Replaced with checks that match this repo.

on:
  push:
    branches: [main, master, develop, CEO]
    # A change of the plan / lessons / evidence alone checks nothing (27.10: 86 doc-only runs ate 344 of the month's Actions minutes).
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main, master]
    paths-ignore: ["docs/**", "**/*.md"]

jobs:
  compose:
    name: Validate compose files
    runs-on: ubuntu-latest
    # Placeholder values only — `config` resolves and type-checks the files,
    # it does not need the sibling service repos or real secrets to be present.
    env:
      SECRET_KEY: ci
      POSTGRES_PASSWORD: ci
      INTERNAL_SERVICE_TOKEN: ci-internal-service-token-only-for-compose-validation
      GEMINI_API_KEY: ci
      NEXT_PUBLIC_AUTH_API_URL: https://ci.invalid
      NEXT_PUBLIC_EXAM_API_URL: https://ci.invalid
      NEXT_PUBLIC_DIAG_API_URL: https://ci.invalid
      CORS_ORIGINS: '["https://ci.invalid"]'
    steps:
      - uses: actions/checkout@v4

      - name: staging (production — algolab.me)
        run: docker compose -f compose/docker-compose.staging.yml config -q

      - name: preview (stage.algolab.me)
        run: docker compose -f compose/docker-compose.preview.yml config -q

      - name: local development
        run: docker compose -f compose/docker-compose.local.yml config -q

  nginx:
    name: Validate nginx configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep answer-bearing Content API internal
        run: |
          # /api/v1/content/tasks returns answer keys and distractor metadata.
          # Browser traffic must never be able to reach it through Nginx;
          # exam and diagnostic use the Docker-internal service address.
          if grep -RInE '^[[:space:]]*location[[:space:]]+/api/v1/content/' nginx/conf.d; then
            echo 'Content Read API must not be exposed through public Nginx.' >&2
            exit 1
          fi

      - name: nginx -t (staging + preview together)
        run: |
          # Both configs are loaded by the same nginx, so test them together —
          # that is what catches duplicate upstream or server_name collisions.
          # A throwaway self-signed cert stands in for Let's Encrypt at the
          # path the configs reference.
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout certs/privkey.pem -out certs/fullchain.pem \
            -subj "/CN=algolab.me" 2>/dev/null

          # nginx resolves every `upstream` host at config-load time and aborts
          # if one is unknown, so point them all at loopback for the test.
          # Upstreams are pinned to container names on purpose — see the
          # comment at the top of staging.conf.
          HOSTS=""
          for c in frontend auth diagnostic exam content landing; do
            HOSTS="$HOSTS --add-host algo-staging-$c:127.0.0.1"
            HOSTS="$HOSTS --add-host algo-preview-$c:127.0.0.1"
          done

          # shellcheck disable=SC2086
          docker run --rm $HOSTS \
            -v "$PWD/nginx/conf.d/staging.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/nginx/conf.d/preview.conf:/etc/nginx/conf.d/preview.conf:ro" \
            -v "$PWD/certs:/etc/letsencrypt/live/algolab.me:ro" \
            nginx:1.27-alpine nginx -t

  runtime-contract:
    name: Keep internal callback contract explicit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require one shared internal token per server stack
        run: |
          # The token must reach auth (receiver), diagnostic (sender),
          # exam (sender/receiver) and content (receiver, since SEC-01 --
          # its full-answer-key read API is otherwise unauthenticated). A
          # root .env is not implicitly inherited when deployment uses
          # --env-file, hence each compose definition must carry this
          # contract explicitly.
          for compose_file in \
            compose/docker-compose.staging.yml \
            compose/docker-compose.preview.yml; do
            count=$(grep -c 'INTERNAL_SERVICE_TOKEN' "$compose_file")
            if [ "$count" -lt 4 ]; then
              echo "$compose_file must pass INTERNAL_SERVICE_TOKEN to auth, diagnostic, exam and content" >&2
              exit 1
            fi
          done

  scripts:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify immutable Git source preparation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: bash -n on every script
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "syntax error: $f"; fail=1; }
          done < <(find scripts -name '*.sh')
          exit $fail
