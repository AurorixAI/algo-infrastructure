# Nginx — stage.algolab.me (preview stack)
#
# Second environment on the same host, fronted by the same nginx as production.
# Upstreams are the algo-preview-* containers on the shared `algo-edge` network.
# TLS uses the same certificate as production, expanded to cover
# stage.algolab.me.
#
# http://stage.algolab.me is handled by the catch-all :80 server in
# staging.conf (ACME challenge + 301 to HTTPS), so no :80 block is needed here.
#
# ⚠ Backend addresses MUST stay in variables resolved at request time, and this
# file MUST NOT declare `upstream` blocks. nginx resolves a literal upstream
# host once, at configuration load, and treats a name it cannot resolve as a
# fatal error:
#
#     [emerg] host not found in upstream "algo-preview-frontend:3000"
#
# It then refuses to start *at all* — and this is the same nginx that serves
# production algolab.me. On 2026-09-06 a failed auth-service migration left
# the preview frontend stuck in `Created` (compose `depends_on:
# service_healthy`), and that single missing preview container took production
# offline for the better part of an hour.
#
# With a variable, resolution happens per request through Docker's embedded
# DNS, so a missing preview container degrades to a 502 on stage.algolab.me
# only, and production is unaffected. Do not "simplify" these back into
# `upstream` blocks.

# Public capability codes and query strings must not enter stage access logs.
map $uri $preview_safe_uri {
    default $uri;
    ~^/(?<preview_link_kind>d|e|invite|diagnostic|set-password|confirm-email)/[^/]+(?<preview_link_tail>/.*)?$ "/$preview_link_kind/[redacted]$preview_link_tail";
    ~^/api/v1/auth/password-links/[^/]+(?<preview_pl_tail>/.*)?$ "/api/v1/auth/password-links/[redacted]$preview_pl_tail";
    ~^/api/v1/(?<preview_api_kind>auth|internal)/diagnostic/[^/]+(?<preview_api_tail>/.*)?$ "/api/v1/$preview_api_kind/diagnostic/[redacted]$preview_api_tail";
    # K3 round 2: invitation code, exam code and the session id in the exam capability routes.
    ~^/api/v1/auth/invite/[^/]+(?<preview_inv_tail>/.*)?$ "/api/v1/auth/invite/[redacted]$preview_inv_tail";
    # K2-2 (E): the token of a change of an e-mail (the page /confirm-email/{token} is above)
    ~^/api/v1/auth/email-change/[^/]+(?<preview_ec_tail>/.*)?$ "/api/v1/auth/email-change/[redacted]$preview_ec_tail";
    ~^/api/v1/exams/by-code/[^/]+/session-status/[^/]+$ "/api/v1/exams/by-code/[redacted]/session-status/[redacted]";
    ~^/api/v1/exams/by-code/[^/]+(?<preview_bc_tail>/.*)?$ "/api/v1/exams/by-code/[redacted]$preview_bc_tail";
}
log_format preview_safe escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","host":"$host",'
    '"method":"$request_method","uri":"$preview_safe_uri","status":$status,'
    '"request_time":$request_time,"bytes":$body_bytes_sent}';

server {
    listen 443 ssl;
    http2 on;
    server_name stage.algolab.me;
    access_log /dev/stdout preview_safe;

    # A diagnostic capability in the page URL must not become the Referer
    # of asset/API requests (including nginx upstream warning context).
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;
    # Every stage host is closed to search engines (K3 I7, АД-8). The Next server may add its own X-Robots-Tag
    # (noindex on /d/, /e/ …): hide it so the answer carries exactly one.
    proxy_hide_header X-Robots-Tag;
    add_header X-Robots-Tag "noindex" always;
    # Stream responses beyond the bounded proxy buffers instead of spilling
    # them to disk and logging the caller's Referer in a temporary-file warning.
    proxy_max_temp_file_size 0;

    ssl_certificate     /etc/letsencrypt/live/algolab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algolab.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    # Docker's embedded DNS. `valid=10s` keeps a restarted or recreated
    # container's new address from being cached for long.
    resolver       127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # Every location below passes the request URI through unchanged, which is
    # exactly what the previous `proxy_pass http://upstream/api/v1/<x>/;` did:
    # the location prefix and the target prefix were identical. `/landing/` is
    # the one exception and rewrites explicitly.

    # ── API routes ─────────────────────────────────────────────────────────

    # The console API is served only on console.stage.algolab.me (K1).
    location /api/v1/platform/ {
        return 404;
    }

    # Public «Запросить демо» form (K1).
    location /api/v1/public/ {
        client_max_body_size 64k;          # K3: the demo form is a small JSON; the server block allows 50m for imports
        set                $preview_auth algo-preview-auth:8000;
        proxy_pass         http://$preview_auth;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req          zone=preview_auth burst=20 nodelay;
    }

    location /api/v1/auth/ {
        set                $preview_auth algo-preview-auth:8000;
        proxy_pass         http://$preview_auth;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req          zone=preview_auth burst=20 nodelay;
    }

    location /api/v1/organizations/ {
        set                $preview_auth algo-preview-auth:8000;
        proxy_pass         http://$preview_auth;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Exam history is owned by exam-service; the remaining student routes
    # continue to use auth. Regex wins over the general student prefix.
    location ~ ^/api/v1/students/[^/]+/exam-history$ {
        set                $preview_exam algo-preview-exam:8003;
        proxy_pass         http://$preview_exam;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/students/ {
        set                $preview_auth algo-preview-auth:8000;
        proxy_pass         http://$preview_auth;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/groups/ {
        set                $preview_auth algo-preview-auth:8000;
        proxy_pass         http://$preview_auth;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/diagnostic/ {
        set                $preview_diagnostic algo-preview-diagnostic:8002;
        proxy_pass         http://$preview_diagnostic;
        # DIAG-6: answers are capped at 2000 chars; no diagnostic request needs more than a few KB
        client_max_body_size 256k;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Analytics lives in diagnostics-service too (separate router/prefix) —
    # without this block every analyticsApi.* call 404s by falling through
    # to the frontend catch-all instead of reaching the backend.
    location /api/v1/analytics/ {
        set                $preview_diagnostic algo-preview-diagnostic:8002;
        proxy_pass         http://$preview_diagnostic;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/exam {
        set                $preview_exam algo-preview-exam:8003;
        proxy_pass         http://$preview_exam;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # exam-service also owns the textbook catalogue the exam builder reads
    # (list, skill tree, table of contents, tasks). Without these blocks the
    # requests fell through to the frontend catch-all and answered 404, so
    # "По учебнику" and "По темам" could never load. `/api/v1/internal` and
    # `/api/v1/toc` are deliberately NOT exposed: the first is
    # service-to-service only, the second is not called by any client.
    location /api/v1/textbooks {
        set                $preview_exam algo-preview-exam:8003;
        proxy_pass         http://$preview_exam;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Organisation-wide, read-only exam monitoring for admins.
    location /api/v1/admin/ {
        set                $preview_exam algo-preview-exam:8003;
        proxy_pass         http://$preview_exam;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Deliberately no public /api/v1/content/ route.  The content read API
    # includes correct answers and distractor metadata for exam/diagnostic
    # services, so it is reachable only through the internal Docker network.
    # Student-facing figures are served by the frontend's constrained proxy.

    # ── Landing page ───────────────────────────────────────────────────────
    # The only prefix-stripping route: `/landing/x` reaches the container as
    # `/x`, which the previous trailing-slash `proxy_pass .../;` did
    # implicitly. A variable proxy_pass cannot, so it is spelled out.
    location /landing/ {
        set                $preview_landing algo-preview-landing:5000;
        rewrite            ^/landing/(.*)$ /$1 break;
        proxy_pass         http://$preview_landing;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Frontend (everything else) ─────────────────────────────────────────
    location / {
        set                $preview_frontend algo-preview-frontend:3000;
        proxy_pass         http://$preview_frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# Rate limiting zone for the preview stack (separate counter from prod)
limit_req_zone $binary_remote_addr zone=preview_auth:10m rate=10r/s;

# ── console.stage.algolab.me: «Панель ALGO» on stage (K1) ──────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name console.stage.algolab.me;
    access_log /dev/stdout preview_safe;

    ssl_certificate     /etc/letsencrypt/live/algolab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algolab.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 2m;
    resolver       127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/v1/platform/ {
        set                $preview_auth algo-preview-auth:8000;
        proxy_pass         http://$preview_auth;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req          zone=preview_auth burst=20 nodelay;
    }

    location /api/ {
        return 404;
    }

    root /usr/share/nginx/console-stage;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

# ── landing.stage.algolab.me: stage mirror of the landing algolab.me (K3 I7) ──────────────────────────────────────
# Mirror of the future production block (staging-apex-landing.conf.disabled): the SAME rules under another name, so the
# whole scheme (static landing, /api/v1/public/ -> auth, everything else -> the product) is rehearsed on stage first.
# stage.algolab.me stays the product (the mirror of app.algolab.me).
#
#   * Static files: ~/algo/landing/stage (mounted read-only at /usr/share/nginx/landing-stage), updated IN PLACE by
#     algo-landing/deploy/deploy_landing.sh. Never rename the folder: the bind mount would stay on the old inode.
#   * The rule is INVERTED (K3 §0 п.2, risk 6): the landing owns only the paths listed below, everything else is a
#     product path and goes to stage.algolab.me with the same path and query (302; 307 for POST etc.). There is no
#     white list of product paths. The landing is a one-page site without a client router, so there is no SPA
#     fallback: an unknown path without a dot (/login, /owner …) is a product path, not a landing page.
#     ADD A NEW PUBLIC FILE OF THE LANDING (e.g. a privacy page) TO THE LIST BELOW, or it is redirected to the product.
#   * Headers: algo-landing/SECURITY.md. The CSP hash is sha256 of the inline JSON-LD of client/index.html; it changes
#     whenever that block changes (landing test seo.test.ts, then this file and staging-apex-landing.conf.disabled).
#   * Maps use the prefix `landing_stage_`; the production twin uses `landing_prod_` (both files can be loaded at once).

# Cache-Control by path (sent only on 2xx/3xx: an error must not be cached for a year). `$uri` is the final URI, so a
# request for `/` is judged as `/index.html`.
map $uri $landing_stage_cache {
    default                          "no-cache";
    ~^/assets/                       "public, max-age=31536000, immutable";
    ~^/(robots\.txt|sitemap\.xml)$   "public, max-age=3600, must-revalidate";
}

# 403 for declared AI crawlers (SECURITY.md). robots.txt stays readable for them: a crawler that gets 403 there
# treats the site as «no restrictions».
map $http_user_agent $landing_stage_bot_ua {
    default 0;
    ~*\b(GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-User|Claude-SearchBot|CCBot|PerplexityBot|Perplexity-User|Bytespider)\b 1;
}
map $uri $landing_stage_robots_path {
    default      0;
    /robots.txt  1;
}
map "$landing_stage_bot_ua$landing_stage_robots_path" $landing_stage_bot {
    default 0;
    "10"    1;
}

server {
    listen 443 ssl;
    http2 on;
    server_name landing.stage.algolab.me;
    access_log /dev/stdout preview_safe;

    ssl_certificate     /etc/letsencrypt/live/algolab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algolab.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 64k;
    resolver       127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    proxy_max_temp_file_size 0;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Headers of the landing (SECURITY.md). All at server level with `always`; no location below uses add_header, so
    # none of them is dropped by nginx's add_header inheritance rule. The upstream's own copies are hidden.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header Cache-Control;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-4aGtvtcALQgeHnlSqbuF2OnJMzibRdE21wZJyYZkEuY=' https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'; media-src 'self'; worker-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control $landing_stage_cache;

    if ($landing_stage_bot) {
        return 403;
    }

    root  /usr/share/nginx/landing-stage;
    index index.html;

    # Dot-files of the deploy (/.revision, /.assets-manifest) and anything else hidden: not public.
    location ^~ /. {
        return 404;
    }

    # Public «Запросить демо» form: the same block as on stage.algolab.me, to the preview auth (K3 A6: X-Real-IP,
    # 64k, limit_req are part of the contract: without X-Real-IP all requests would share one rate-limit key).
    location /api/v1/public/ {
        client_max_body_size 64k;
        set                $preview_auth algo-preview-auth:8000;
        proxy_pass         http://$preview_auth;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req          zone=preview_auth burst=20 nodelay;
    }

    # ── The paths the landing owns (the build of algo-landing/client: index.html + client/public) ─────────────────
    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files /index.html =404;
    }
    location ~ ^/(favicon\.svg|favicon\.png|opengraph\.jpg|opengraph\.png|opengraph-source\.svg|robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
    }
    location ~ ^/(assets|fonts|samples)/ {
        try_files $uri =404;
    }

    # The old landing was served under /landing/ (K3 B11, I6): its address now leads to the one page of the landing.
    location ^~ /landing/ {
        return 302 /;
    }

    # ── Everything else is a product path (old links: /login, /owner/…, /d/<code>, /e/<code>, /invite/…,
    #    /set-password/…, /favicon.ico, /api/version, /api/v1/… and so on) ───────────────────────────────────────
    # 302 (temporary) first; after a week of stability 301/308 (K3 §5). A body-carrying method gets 307 so a POST is not
    # turned into a GET. `$request_uri` keeps path and query (utm tags, one-time tokens).
    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 307 https://stage.algolab.me$request_uri;
        }
        return 302 https://stage.algolab.me$request_uri;
    }
}
