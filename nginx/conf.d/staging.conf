# Nginx — Staging (HTTPS via Let's Encrypt)
# Routes browser traffic to the correct container on the algo-internal network.
#
# ⚠ Upstreams MUST use container names (algo-staging-*), not bare compose
# service names (frontend, auth-service, ...). This nginx also sits on the
# shared `algo-edge` network to serve stage.algolab.me, and the preview stack
# publishes the very same service names as aliases there. With bare names,
# Docker resolved them to the *preview* containers and production silently
# started serving the stage stack and its empty databases. Container names are
# unique across both stacks, so they resolve unambiguously. Do not "simplify"
# these back to service names.

upstream frontend      { server algo-staging-frontend:3000; }
upstream auth          { server algo-staging-auth:8000; }
upstream diagnostic    { server algo-staging-diagnostic:8002; }
upstream exam          { server algo-staging-exam:8003; }
upstream content       { server algo-staging-content:8004; }
upstream landing       { server algo-staging-landing:5000; }

# ── HTTP: ACME challenge + redirect everything else to HTTPS ────────────────
server {
    listen 80 default_server;
    server_name algolab.me www.algolab.me _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────
# `default_server` is explicit on purpose: production must answer a request
# whose Host matches nothing. Without it nginx silently promotes whichever
# server block it loaded first, which is decided by the alphabetical order of
# the files in conf.d — so renaming a file would hand unmatched production
# traffic to the preview stack.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name algolab.me www.algolab.me;

    ssl_certificate     /etc/letsencrypt/live/algolab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algolab.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    # ── API routes ─────────────────────────────────────────────────────────

    location /api/v1/auth/ {
        proxy_pass         http://auth/api/v1/auth/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req          zone=auth burst=20 nodelay;
    }

    location /api/v1/organizations/ {
        proxy_pass         http://auth/api/v1/organizations/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/students/ {
        proxy_pass         http://auth/api/v1/students/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/groups/ {
        proxy_pass         http://auth/api/v1/groups/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/diagnostic/ {
        proxy_pass         http://diagnostic/api/v1/diagnostic/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Analytics lives in diagnostics-service too (separate router/prefix) —
    # without this block every analyticsApi.* call 404s by falling through
    # to the frontend catch-all instead of reaching the backend.
    location /api/v1/analytics/ {
        proxy_pass         http://diagnostic/api/v1/analytics/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/exam {
        proxy_pass         http://exam/api/v1/exam;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # exam-service also owns the textbook catalogue the exam builder reads
    # (list, skill tree, table of contents, tasks). Without these blocks the
    # requests fell through to the frontend catch-all and answered 404, so
    # "По учебнику" and "По темам" could never load. `/api/v1/internal` and
    # `/api/v1/toc` are deliberately NOT exposed: the first is
    # service-to-service only, the second is not called by any client.
    location /api/v1/textbooks {
        proxy_pass         http://exam/api/v1/textbooks;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Organisation-wide, read-only exam monitoring for admins.
    location /api/v1/admin/ {
        proxy_pass         http://exam/api/v1/admin/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/content/ {
        proxy_pass         http://content/api/v1/content/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Landing page (root) ────────────────────────────────────────────────
    location /landing/ {
        proxy_pass         http://landing/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Frontend (everything else) ─────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
